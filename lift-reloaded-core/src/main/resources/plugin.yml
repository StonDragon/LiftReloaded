authors: [croxis, kikelkik]
main: io.liftreloaded.LiftPlugin
name: LiftReloaded
version: ${project.version}
description: Simple, realistic elevators for Minecraft 26.2
website: https://github.com/kikelkik/LiftReloaded
softdepend: [NoCheatPlus, NoteBlockAPI]
permissions:
  lift:
    description: Can ride in a lift
    default: true
  lift.change:
    description: Can change lift floors
    default: true
  lift.reload:
    description: Reloads the lift plugin
    default: op
commands:
   lift:
      description: Scans or reloads LiftReloaded.
      usage: /<command>
      permission: lift
      permission-message: You don't have lift permissions
api-version: "${api.version}"
